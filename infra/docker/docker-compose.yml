services:
  postgres:
    image: postgres:16-alpine
    container_name: stockx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockx}
      POSTGRES_DB: ${POSTGRES_DB:-stockx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stockx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockx} -d ${POSTGRES_DB:-stockx}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockx_postgres_data:

